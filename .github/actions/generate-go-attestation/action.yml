name: 'Generate Go Attestation'
description: 'Creates a provenance manifest for a Golang module and generates an attestation for it'
outputs:
  manifest_path:
    description: "The generated provenance manifest"
    value: ${{ steps.set_outputs.outputs.manifest_path }}
  attestation_path:
    description: "The generated attestation"
    value: ${{ steps.set_outputs.outputs.attestation_path }}
runs:
  using: "composite"
  steps:
    - name: Determine module information
      id: module
      shell: bash
      run: |
        set -euo pipefail

        MODULE="$(go list -m)"
        VERSION="${GITHUB_REF_NAME}"
        COMMIT="$(git rev-parse "${VERSION}^{commit}")"

        echo "module=$MODULE" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

        echo "SCHEMA_URL=https://raw.githubusercontent.com/feronatech/shared-workflows/main/attestation/schema/v2/go-module-provenance.schema.json" >> "$GITHUB_ENV"

    - name: Download published module
      shell: bash
      env:
        MODULE: ${{ steps.module.outputs.module }}
        VERSION: ${{ steps.module.outputs.version }}
      run: |
        set -euo pipefail

        # A newly published version may take a short time to appear.
        for attempt in {1..12}; do
          if GOPROXY=https://proxy.golang.org \
              go mod download -json "${MODULE}@${VERSION}" \
              > module-download.tmp.json; then
            mv module-download.tmp.json module-download.json
            break
          fi

          if [ "$attempt" = 12 ]; then
            echo "Module did not become available from proxy.golang.org"
            exit 1
          fi

          sleep 10
        done

    - name: Verify proxy matches tag
      shell: bash
      env:
        COMMIT: ${{ steps.module.outputs.commit }}
      run: |
        set -euo pipefail

        ORIGIN_HASH="$(jq -r '.Origin.Hash // empty' module-download.json)"

        if [ -z "$ORIGIN_HASH" ]; then
          echo "Proxy response has no Origin.Hash, cannot verify"
          exit 1
        fi

        if [ "$ORIGIN_HASH" != "$COMMIT" ]; then
          echo "Mismatch: proxy=$ORIGIN_HASH tag=$COMMIT"
          exit 1
        fi

    - name: Locate module zip
      id: zip
      shell: bash
      run: |
        set -euo pipefail

        ZIP="$(jq -r '.Zip' module-download.json)"
        test -f "$ZIP"

        echo "path=$ZIP" >> "$GITHUB_OUTPUT"
        echo "sha256=$(sha256sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Create provenance manifest
      shell: bash
      env:
        MODULE: ${{ steps.module.outputs.module }}
        VERSION: ${{ steps.module.outputs.version }}
        COMMIT: ${{ steps.module.outputs.commit }}
      run: |
        set -euo pipefail

        SUM="$(jq -r '.Sum' module-download.json)"
        GOMOD_SUM="$(jq -r '.GoModSum' module-download.json)"
        ORIGIN_HASH="$(jq -r '.Origin.Hash' module-download.json)"

        jq -n \
          --arg module "$MODULE" \
          --arg version "$VERSION" \
          --arg commit "$COMMIT" \
          --arg originCommit "$ORIGIN_HASH" \
          --arg sum "$SUM" \
          --arg goModSum "$GOMOD_SUM" \
          --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            module: $module,
            version: $version,
            commit: $commit,
            originCommit: $originCommit,
            tagMatchesProxy: ($commit == $originCommit),
            moduleSum: $sum,
            goModSum: $goModSum,
            generatedAt: $generatedAt
          }' > module-provenance.json

        jq . module-provenance.json

    - name: Validate predicate against schema
      shell: bash
      run: |
        set -euo pipefail
        pipx install check-jsonschema
        check-jsonschema --schemafile "$SCHEMA_URL" module-provenance.json

    - name: Attest provenance manifest
      id: attest
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.zip.outputs.path }}
        predicate-type: ${{ env.SCHEMA_URL }}
        predicate-path: module-provenance.json

    - name: Copy attestation bundle
      shell: bash
      env:
        BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
      run: |
        cp "$BUNDLE_PATH" module-provenance.sigstore.json

    - name: Set outputs
      id: set_outputs
      shell: bash
      run: |
        echo "manifest_path=module-provenance.json" >> "$GITHUB_OUTPUT"
        echo "attestation_path=module-provenance.sigstore.json" >> "$GITHUB_OUTPUT"
