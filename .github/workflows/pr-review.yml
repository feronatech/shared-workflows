name: Review Pull Request
on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare OpenCode auth file
        id: prepare_auth
        run: |
          echo '[{"id":"go-cve-autofix-provider","integrationID":"openrouter","label":"API key","active":true,"value":{"type":"key","key":"${{ secrets.OPENROUTER_API_KEY }}"}}]' > opencode_auth.json

      - name: Run review
        uses: feronatech/shared-workflows/.github/actions/use-opencode@main
        id: run
        with:
          import_auth_file: opencode_auth.json
          prompt: "Review this pull request for bugs, security issues and missing tests. Be concise."
  
  comment:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add comment to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ needs.review.outputs.result }}
        run: gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
