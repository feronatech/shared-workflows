name: Linting
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: feronatech/shared-workflows/.github/actions/start-go-workflow@main
      
      - name: Run linting using golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
