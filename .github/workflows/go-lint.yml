name: Linting
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      
      - name: Run linting using golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
