name: Testing
on:
  workflow_call:
    inputs:
      parameters:
        description: "Parameters to pass to the test command"
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: feronatech/shared-workflows/.github/actions/start-go-workflow@main
      
      - name: Run tests
        run: go test -v ./... ${{ inputs.parameters }}
