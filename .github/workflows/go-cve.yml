name: Vulnerability Scan
on:
  workflow_call:

jobs:
  cve:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: feronatech/shared-workflows/.github/actions/start-go-workflow@main
      
      - name: Check CVEs using golvulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && govulncheck ./...
